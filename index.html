<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131e2c">
  <meta name="description" content="Баг в больнице — короткая игра о работе системного аналитика. Собери требования, спроектируй алгоритм и помоги наладить запись пациентов.">
  <title>Баг в больнице</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/designer.css">
  <link rel="stylesheet" href="assets/css/screens.css">
  <link rel="stylesheet" href="assets/css/game-shell.css">
  <script defer src="src/data.js"></script>
  <script defer src="src/logic.js"></script>
  <script defer src="src/designer.js"></script>
  <script defer src="src/game.js"></script>
  <script defer src="src/audio.js"></script>
  <script defer src="src/app.js"></script>
</head>
<body class="game-only">
  <main class="game-shell" aria-label="Баг в больнице">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Платформер. A и D или стрелки — движение, пробел — прыжок, E — взаимодействие."></canvas>
      <div class="game-vignette" aria-hidden="true"></div>
      <header class="game-hud">
        <div class="hud-mission">
          <span id="scene-title">01 / К ЗАКАЗЧИКУ</span>
          <strong id="scene-objective">Поговори с заказчиком →</strong>
        </div>
        <nav class="hud-actions" aria-label="Игровое меню">
          <button class="hud-notebook" id="notebook-button" title="Техническое задание">
            ▤ ТЗ <span id="requirement-count">0/4</span>
          </button>
          <button id="help-button" aria-label="Управление и правила" title="Управление">?</button>
          <button id="restart-button" aria-label="Начать заново" title="Начать заново">↻</button>
          <button type="button" class="audio-toggle" data-audio-toggle aria-label="Выключить звук" title="Выключить звук" aria-pressed="false">♪</button>
        </nav>
      </header>
      <div class="interaction-prompt" id="interaction-prompt" hidden>
        <kbd>E</kbd><svg class="interaction-hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 13V5a2 2 0 0 1 4 0v6-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v9c0 4-3 7-7 7h-1c-2 0-4-1-5-3l-4-6a2 2 0 0 1 3-2l2 2Z"/></svg><span></span>
      </div>
      <div class="scene-notice" id="scene-notice" aria-live="polite"></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="game-input-hint" aria-hidden="true">
        <span><kbd>A</kbd><kbd>D</kbd> идти</span>
        <span><kbd>Пробел</kbd> прыгать</span>
        <span><kbd>E</kbd> взаимодействовать</span>
      </div>
      <div class="touch-controls" aria-label="Сенсорное управление">
        <div>
          <button data-control="left" aria-label="Идти влево">←</button>
          <button data-control="right" aria-label="Идти вправо">→</button>
        </div>
        <div>
          <button data-control="down" aria-label="Спуститься по лестнице" title="Спуститься по лестнице">↓</button>
          <button data-control="jump" aria-label="Прыжок / подняться по лестнице">↑</button>
          <button data-control="interact" aria-label="Взаимодействовать" title="Взаимодействовать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 13V5a2 2 0 0 1 4 0v6-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v9c0 4-3 7-7 7h-1c-2 0-4-1-5-3l-4-6a2 2 0 0 1 3-2l2 2Z"/></svg></button>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
